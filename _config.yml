title: "Ningen820 - Cybersecurity Portfolio, Writeups & More"
description: "DFIR investigations, labs writeups, projects, and more"
url: "https://ningen820.github.io"
baseurl: ""
repository: "Ningen820/Ningen820.github.io"
lang: "en"

markdown: kramdown
highlighter: rouge
permalink: pretty
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 2..3
collections:
  writeups:
    output: true
    permalink: /writeups/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: writeups
    values:
      layout: writeup
      reading_time: 0
      category: "Uncategorized"
      difficulty: "Unrated"
      platform: "Unspecified"
      os: "Unspecified"




exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
