<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <link rel="stylesheet" href="{{ '/assets/css/writeup-data.css' | relative_url }}">
  <meta name="google-site-verification" content="rm8-sLDudmPrBSpxY9L1YK1XQ9gn8mecOuIVeK4R2sI" />
  <meta name="google-site-verification" content="wNbHZaGC71ZUXo61GovIZ2Fy9EmUAKPtrh9GI0_6M9U" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'writeup' %}article{% else %}website{% endif %}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/projects.css' | relative_url }}">
</head>
<body data-repo="{{ site.repository | escape }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <div class="site-shell">
    {% include site-nav.html %}
    <main id="main-content">{{ content }}</main>
    {% include site-footer.html %}
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
